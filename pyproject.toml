[build-system]
requires = ["scikit-build-core>=0.9.0", "numpy>=1.21"]
build-backend = "scikit_build_core.build"

[project]
name = "taco-tcl"
version = "0.1.0"
description = "TACO Time-Convolutionless master-equation solvers (C++/CUDA with Python bindings)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.scikit-build]
wheel.packages = ["python/taco"]

[tool.scikit-build.cmake.define]
TACO_BUILD_PYTHON = "ON"
